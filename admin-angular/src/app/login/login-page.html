<div class="auth">
  <aside class="auth-side">
    <a class="auth-wordmark" [href]="homeUrl">SME Commerce</a>
    <div class="auth-side-text">
      <p class="eyebrow">Shop admin</p>
      <p class="auth-quote">Your products, stock and orders, in <em>one place</em>.</p>
    </div>
  </aside>

  <main class="auth-main">
    <div class="auth-card">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p class="auth-sub">New here? <a routerLink="/signup">Open your shop</a></p>

      <!-- (ngSubmit) runs logIn() when the button is clicked or Enter is pressed. -->
      <form class="auth-form" (ngSubmit)="logIn()">
        <label>
          Email
          <input name="email" type="email" autocomplete="username" required [(ngModel)]="email" />
        </label>

        <label>
          Password
          <input name="password" type="password" autocomplete="current-password" required [(ngModel)]="password" />
        </label>

        <button type="submit" class="primary" [disabled]="busy()">
          @if (busy()) {
            Logging in…
          } @else {
            Log in
          }
        </button>

        @if (errorMessage() !== null) {
          <p class="error" role="alert">{{ errorMessage() }}</p>
        }
      </form>
    </div>
  </main>
</div>
