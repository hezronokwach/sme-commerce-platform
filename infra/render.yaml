# Render Blueprint (ADR 0018): the backend as a Docker web service, and its Postgres database.
# In Render: New > Blueprint, pick this repo, and set the Blueprint path to infra/render.yaml.
# Values marked sync: false are typed into Render's dashboard; they never live in the repo.
services:
  - type: web
    name: sme-commerce-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # A free instance sleeps when idle; use a paid one for demos so callbacks don't time out.
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: sme-commerce-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sme-commerce-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sme-commerce-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: sme-commerce-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sme-commerce-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      # This service's own address, for example https://sme-commerce-api.onrender.com
      - key: MPESA_CALLBACK_BASE_URL
        sync: false
      - key: MPESA_CALLBACK_SECRET
        generateValue: true

databases:
  - name: sme-commerce-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
