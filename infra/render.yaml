# Render Blueprint (ADR 0018, 0021): the backend as a Docker web service. The database is on Neon.
# In Render: New > Blueprint, pick this repo, and set the Blueprint path to infra/render.yaml.
# Values marked sync: false are typed into Render's dashboard; they never live in the repo.
services:
  - type: web
    name: sme-commerce-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: frankfurt
    # A free instance sleeps when idle; use a paid one for demos so callbacks don't time out.
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Neon's direct (not "-pooler") connection, split into parts. See docs/deploy.md.
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      # This service's own address, for example https://sme-commerce-api.onrender.com
      - key: MPESA_CALLBACK_BASE_URL
        sync: false
      - key: MPESA_CALLBACK_SECRET
        generateValue: true
      # Product photos and shop logos (ADR 0022), from cloudinary.com > Settings > API Keys.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

