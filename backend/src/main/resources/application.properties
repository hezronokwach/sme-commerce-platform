spring.application.name=sme-commerce

# Flyway owns the schema. Its default location, classpath:db/migration, is scanned with every subfolder
# (platform/, tenant/, identity/, ...), so a new module folder is picked up without touching this file.
# Versions are shared across folders: V1 platform, V10-19 tenant, V20-29 identity, V30 catalog, ...
# (see the Database Design doc).
# Already the default, kept visible on purpose: startup fails if an applied migration was edited.
spring.flyway.validate-on-migrate=true
# Each module has its own version range, so numbers don't arrive in order: V95 (platform) was added
# before V50 (ordering). Without this, a database that already ran V95 would refuse V50 at startup.
spring.flyway.out-of-order=true
# Hibernate must never create or alter tables; that is Flyway's job.
spring.jpa.hibernate.ddl-auto=none
# No Hibernate session held open for the whole web request: each transaction opens and closes its own,
# so lazy loading can't quietly hit the database from a controller or the JSON writer.
spring.jpa.open-in-view=false

# Errors: GlobalErrorHandler (next to the application class) turns every error into one problem-JSON
# shape, so Spring Boot's own problem-details handler isn't switched on here.

# Indented JSON at /v3/api-docs, so the saved docs/api/openapi.json is readable and diffs line by line.
springdoc.writer-with-default-pretty-printer=true
# Our endpoints all return JSON. Without this the description says "*/*", and generated clients would
# read every response as raw bytes instead of JSON.
springdoc.default-produces-media-type=application/json

# Every log line starts with the request's correlation id (set by CorrelationIdFilter), so all lines of
# one request can be found together; the same id is in the X-Correlation-Id header and every error body.
logging.pattern.correlation=[%X{correlationId:-}]

# Local secrets live in a git-ignored .env file next to this app (copy .env.example).
# On Render they are real environment variables, and this import finds no file and does nothing.
spring.config.import=optional:file:.env[.properties]

# Access tokens (JWT). No default for the secret: the app must not start without one.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sme-commerce
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=14d

# Fake payment provider: how long after "start" its pretend callback arrives (Guide 5.9).
app.payments.fake.callback-delay=3s

# Card payments through Stripe test mode (ADR 0013). Keys only from the environment (backend/.env).
# Empty means card payments are "not set up": every card attempt is refused politely.
app.payments.card.secret-key=${STRIPE_SECRET_KEY:}
app.payments.card.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
app.payments.card.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
app.payments.card.base-url=https://api.stripe.com
app.payments.card.timeout=10s

# Reconciliation (Guide 5.7): asking providers again when no answer came. See ReconciliationProperties.
app.payments.reconciliation.every=30s
app.payments.reconciliation.first-check-after-accepted=90s
app.payments.reconciliation.first-check-after-unknown=60s
app.payments.reconciliation.backoff=30s,1m,2m,5m,10m
app.payments.reconciliation.unknown-give-up-after=3m
app.payments.reconciliation.timed-out-after=10m
app.payments.reconciliation.timed-out-check-every=1h
app.payments.reconciliation.stop-after=24h
app.payments.reconciliation.batch-size=50
# Protection from a provider that is down (ADR 0014): 5 failed calls in a row stop calls to it for 30 s,
# and a status query is tried again after 200 ms and after 1 s.
app.payments.provider-calls.failures-to-open=5
app.payments.provider-calls.open-for=30s
app.payments.provider-calls.query-retry-waits=200ms,1s
# Unpaid orders past their deadline are expired (and their stock released) this often.
app.ordering.expiry.every=60s

# Reliable events (Guide 6.1). Every event a listener must handle is saved in event_publication in the
# publisher's own transaction, and marked COMPLETED when the listener finishes.
# On startup, deliver again every event whose listener never finished (the app died, or it failed).
spring.modulith.events.republish-outstanding-events-on-restart=true
# A finished row keeps its completion date (instead of being deleted at once), so you can look back at
# what happened; EventRetryJob deletes rows that finished more than a week ago.
spring.modulith.events.completion-mode=update
# Rows stuck without an answer are marked FAILED after these times, so EventRetryJob retries them:
# PUBLISHED = no listener picked it up (the app died right after the publisher's commit),
# PROCESSING = a listener started but never finished (the app died during it),
# RESUBMITTED = a retry that never finished either.
spring.modulith.events.staleness.published=2m
spring.modulith.events.staleness.processing=5m
spring.modulith.events.staleness.resubmitted=5m
spring.modulith.events.staleness.check-interval=1m

# EventRetryJob: how often to retry failed events, how old a failure must be before it is retried,
# when to raise an ERROR about events still not done, and how long finished rows are kept.
app.events.retry-every=2m
app.events.retry-older-than=1m
app.events.alert-older-than=15m
app.events.keep-completed-for=7d
# Every day at 03:00 (seconds minutes hours day month weekday).
app.events.cleanup-cron=0 0 3 * * *

# Assistant (ADR 0007, 0015). Spring AI's OpenAI-compatible client, used for two providers:
# embeddings from Gemini, chat from Groq. Keys only from the environment.
spring.ai.model.chat=openai
spring.ai.model.embedding=openai
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Embeddings: gemini-embedding-001 through Gemini's OpenAI-compatible endpoint, cut down to 768 numbers
# (pgvector's HNSW index takes at most 2000). Without a key every indexing attempt ends FAILED.
spring.ai.openai.embedding.base-url=https://generativelanguage.googleapis.com/v1beta/openai
spring.ai.openai.embedding.api-key=${GEMINI_API_KEY:not-set}
spring.ai.openai.embedding.options.model=gemini-embedding-001
spring.ai.openai.embedding.options.dimensions=768
spring.ai.openai.embedding.timeout=20s
# Chat: Groq's OpenAI-compatible endpoint. Low temperature keeps answers close to the shop's text.
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.api-key=${GROQ_API_KEY:not-set}
spring.ai.openai.chat.options.model=${GROQ_MODEL:llama-3.3-70b-versatile}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.chat.options.max-tokens=200
spring.ai.openai.chat.timeout=15s
spring.ai.openai.chat.max-retries=1
# Answering (Guide 7.2): the matches given to the model, and the limits that keep AI costs in check.
app.assistant.max-matches=4
app.assistant.min-similarity=0.5
app.assistant.questions-per-minute=10
app.assistant.daily-questions=200
app.assistant.daily-tokens=100000
# The chunks live in assistant.vector_store, which V80 creates (not Spring AI).
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-name=assistant
spring.ai.vectorstore.pgvector.table-name=vector_store
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.distance-type=cosine-distance
spring.ai.vectorstore.pgvector.index-type=hnsw
# Uploads (txt or md, Guide 7.1): the service refuses files over 2 MB with a clear 400; this outer
# limit only stops much larger requests early (413).
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
