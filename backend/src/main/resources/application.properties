spring.application.name=sme-commerce

# Flyway owns the schema. Its default location, classpath:db/migration, is scanned with every subfolder
# (platform/, tenant/, identity/, ...), so a new module folder is picked up without touching this file.
# Versions are shared across folders: V1 platform, V10-19 tenant, V20-29 identity, V30 catalog, ...
# (see the Database Design doc).
# Already the default, kept visible on purpose: startup fails if an applied migration was edited.
spring.flyway.validate-on-migrate=true
# Each module has its own version range, so numbers don't arrive in order: V95 (platform) was added
# before V50 (ordering). Without this, a database that already ran V95 would refuse V50 at startup.
spring.flyway.out-of-order=true
# Hibernate must never create or alter tables; that is Flyway's job.
spring.jpa.hibernate.ddl-auto=none
# No Hibernate session held open for the whole web request: each transaction opens and closes its own,
# so lazy loading can't quietly hit the database from a controller or the JSON writer.
spring.jpa.open-in-view=false

# Errors: GlobalErrorHandler (next to the application class) turns every error into one problem-JSON
# shape, so Spring Boot's own problem-details handler isn't switched on here.

# Indented JSON at /v3/api-docs, so the saved docs/api/openapi.json is readable and diffs line by line.
springdoc.writer-with-default-pretty-printer=true
# Our endpoints all return JSON. Without this the description says "*/*", and generated clients would
# read every response as raw bytes instead of JSON.
springdoc.default-produces-media-type=application/json

# Every log line starts with the request's correlation id (set by CorrelationIdFilter), so all lines of
# one request can be found together; the same id is in the X-Correlation-Id header and every error body.
logging.pattern.correlation=[%X{correlationId:-}]

# Local secrets live in a git-ignored .env file next to this app (copy .env.example).
# On Render they are real environment variables, and this import finds no file and does nothing.
spring.config.import=optional:file:.env[.properties]

# Access tokens (JWT). No default for the secret: the app must not start without one.
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=sme-commerce
app.jwt.access-ttl=15m
app.jwt.refresh-ttl=14d

# Fake payment provider: how long after "start" its pretend callback arrives (Guide 5.9).
app.payments.fake.callback-delay=3s

# Reliable events (Guide 6.1). Every event a listener must handle is saved in event_publication in the
# publisher's own transaction, and marked COMPLETED when the listener finishes.
# On startup, deliver again every event whose listener never finished (the app died, or it failed).
spring.modulith.events.republish-outstanding-events-on-restart=true
# A finished row keeps its completion date (instead of being deleted at once), so you can look back at
# what happened; EventRetryJob deletes rows that finished more than a week ago.
spring.modulith.events.completion-mode=update
# Rows stuck without an answer are marked FAILED after these times, so EventRetryJob retries them:
# PUBLISHED = no listener picked it up (the app died right after the publisher's commit),
# PROCESSING = a listener started but never finished (the app died during it),
# RESUBMITTED = a retry that never finished either.
spring.modulith.events.staleness.published=2m
spring.modulith.events.staleness.processing=5m
spring.modulith.events.staleness.resubmitted=5m
spring.modulith.events.staleness.check-interval=1m

# EventRetryJob: how often to retry failed events, how old a failure must be before it is retried,
# when to raise an ERROR about events still not done, and how long finished rows are kept.
app.events.retry-every=2m
app.events.retry-older-than=1m
app.events.alert-older-than=15m
app.events.keep-completed-for=7d
# Every day at 03:00 (seconds minutes hours day month weekday).
app.events.cleanup-cron=0 0 3 * * *
