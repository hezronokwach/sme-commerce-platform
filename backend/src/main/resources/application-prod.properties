# Production (Render), switched on by SPRING_PROFILES_ACTIVE=prod (ADR 0018).

# The database is on Neon (ADR 0021), given as separate values; Spring needs the JDBC form.
# Neon only accepts encrypted connections, so sslmode=require.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Neon's free database sleeps when idle and takes a few seconds to wake; a small pool is plenty.
spring.datasource.hikari.maximum-pool-size=5

# Render's proxy adds X-Forwarded-For. Trusting it (only from private proxy addresses) gives each
# customer their own rate limit instead of everyone sharing the proxy's address.
server.forward-headers-strategy=native

# The API description and Swagger UI are for development.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
