name: CI/CD Pipeline (Staging & Main)

on:
  push:
    branches: [ staging, main ]

permissions:
  contents: read

# Never run two deploys of the same branch at once; let the running one finish
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # 1. Build, Run Tests & Update SonarQube Branch Status
  build-and-analyze:
    name: Build & SonarQube Update
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # verify = compile + tests (Testcontainers) + package the jar
      - name: Build & Test
        run: ./mvnw clean verify --no-transfer-progress

      - name: Cache Sonar packages
        if: env.SONAR_TOKEN != ''
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Skipped until a SONAR_TOKEN repo secret exists
      - name: Update Sonar Dashboard
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw sonar:sonar --no-transfer-progress -Dsonar.branch.name=${{ github.ref_name }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sme-commerce-${{ github.ref_name }}
          path: target/*.jar

  # 2. Deployment to Staging Environment
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-analyze
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: sme-commerce-staging

      - name: Execute Staging Deployment
        run: |
          echo "Deploying SME Commerce to Staging environment..."
          # Day 26-27: build/push the Docker image and trigger the Render deploy hook here

  # 3. Deployment to Production Environment
  deploy-production:
    name: Deploy to Production
    needs: build-and-analyze
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v8
        with:
          name: sme-commerce-main

      - name: Execute Production Deployment
        run: |
          echo "Deploying SME Commerce to Production environment..."
          # Day 26-27: build/push the Docker image and trigger the Render deploy hook here
